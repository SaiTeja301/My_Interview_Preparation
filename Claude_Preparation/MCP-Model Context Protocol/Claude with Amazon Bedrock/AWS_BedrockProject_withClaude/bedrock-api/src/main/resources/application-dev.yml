# ============================================================
# APPLICATION-DEV.YML — Development Profile Configuration
# ============================================================
# Activated by: spring.profiles.active=dev (in application.yml)
# Or by: mvn spring-boot:run -Dspring.profiles.active=dev
#
# This file OVERRIDES values in application.yml for development.
# Only put development-specific settings here.
# ============================================================

server:
  port: 8080

aws:
  bedrock:
    region: ${AWS_BEDROCK_REGION:ap-south-1}
    # SECURITY: NEVER commit real credentials to source control!
    # For local development, use ONE of these methods (in priority order):
    #   1. AWS CLI profile:  aws configure --profile dev
    #      Then set: AWS_PROFILE=dev
    #   2. Environment variables in your shell or .env file (git-ignored):
    #      AWS_ACCESS_KEY_ID=AKIAxxxxx
    #      AWS_SECRET_ACCESS_KEY=xxxxxxxxx
    #   3. As a last resort, set below — but ONLY if this file stays git-ignored:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

    # Use a cheaper model for development/testing
    default-model: apac.anthropic.claude-3-sonnet-20240229-v1:0
    max-tokens: 1024            # Lower tokens to save costs during dev
    temperature: 0.7

# More generous rate limiting for development
rate-limit:
  requests-per-minute: 30

# Verbose logging for development
logging:
  level:
    root: INFO
    com.awsbedrock.api: DEBUG
    software.amazon.awssdk: DEBUG    # See full AWS SDK logs in dev
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{20} - %msg%n"

# Pretty-print JSON in development
spring:
  jackson:
    serialization:
      indent-output: true
